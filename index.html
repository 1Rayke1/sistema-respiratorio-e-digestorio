<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TikTok Gold Downloader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Baixar vídeo do TikTok sem marca d’água. Downloader gratuito, rápido e fácil para salvar vídeos do TikTok em HD.">
  <meta name="keywords" content="baixar vídeo tiktok, download tiktok, tiktok sem marca d'água, tiktok downloader">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      background: radial-gradient(circle at top, #2a1f0a, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #f5e6b3;
    }

    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        120deg,
        rgba(212,175,55,0.05),
        rgba(212,175,55,0.05) 2px,
        transparent 2px,
        transparent 40px
      );
      animation: moveGold 20s linear infinite;
    }

    @keyframes moveGold {
      from { transform: translate(0,0); }
      to { transform: translate(-200px, -200px); }
    }

    .card {
      position: relative;
      background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
      border-radius: 26px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      border: 1px solid rgba(212,175,55,0.4);
      box-shadow: 0 0 40px rgba(212,175,55,0.35), inset 0 0 25px rgba(212,175,55,0.08);
      z-index: 2;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { margin: 0 0 12px; font-size: 26px; color: #d4af37; text-shadow: 0 0 12px rgba(212,175,55,0.7); }
    p { font-size: 14px; color: #e8dca0; margin-bottom: 26px; }
    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid rgba(212,175,55,0.6);
      background: #000;
      color: #f5e6b3;
      font-size: 14px;
      outline: none;
      box-shadow: inset 0 0 10px rgba(212,175,55,0.15);
    }
    input::placeholder { color: #bfae6a; }
    button {
      width: 100%;
      margin-top: 26px;
      padding: 16px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(90deg, #d4af37, #f5e6b3);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(212,175,55,0.5);
      transition: all 0.3s ease;
    }
    button:hover { transform: scale(1.05); }

    .footer {
      position: absolute;
      bottom: 10px;
      font-size: 12px;
      color: #bfae6a;
      right: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>TikTok Gold Downloader</h1>
    <p>Baixe vídeos do TikTok sem marca d’água de forma simples e rápida.</p>
    <input type="text" id="tiktokUrl" placeholder="Cole o link do TikTok aqui" />
    <button onclick="baixar()">Baixar sem marca d'água</button>
  </div>

  <div class="footer">Criado por Rayke Jovino de Souza</div>

  <script>
    async function baixar() {
      const url = document.getElementById('tiktokUrl').value.trim();
      if(!url) { alert("Por favor, cole o link do TikTok."); return; }

      // Chama o backend que vai processar o download
      try {
        const response = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error("Erro ao processar o download");

        const blob = await response.blob();
        const a = document.createElement("a");
        a.href = window.URL.createObjectURL(blob);
        a.download = "video-tiktok.mp4";
        a.click();
      } catch (err) {
        alert("Não foi possível baixar o vídeo. Tente outro link.");
        console.error(err);
      }
    }
  </script>
</body>
</html>

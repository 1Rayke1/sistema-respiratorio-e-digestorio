<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomia em Jogo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA INICIAL -->
    <section id="inicio" class="tela ativa">
        <div class="container">
            <header class="cabecalho">
                <h1>🧠 Anatomia em Jogo</h1>
                <p>Estude os sistemas Respiratório e Digestório</p>
            </header>

            <div class="selecao-sistemas">
                <h2>Escolha o sistema</h2>

                <div class="sistemas">
                    <button class="card-sistema"
                            onclick="selecionarSistema('respiratorio')">
                        <span class="icone">🫁</span>
                        <strong>Sistema Respiratório</strong>
                        <small>Estruturas e anatomia do sistema respiratório</small>
                    </button>

                    <button class="card-sistema"
                            onclick="selecionarSistema('digestorio')">
                        <span class="icone">🫃</span>
                        <strong>Sistema Digestório</strong>
                        <small>Estruturas e anatomia do sistema digestório</small>
                    </button>
                </div>
            </div>

            <div id="configuracao" class="configuracao">
                <button class="botao-voltar" onclick="voltarMenu()">
                    ← Voltar
                </button>

                <div class="config-box">
                    <h2 id="tituloSistema">Sistema</h2>

                    <p>Escolha o modo de estudo:</p>

                    <div class="modos">
                        <button class="botao-modo"
                                onclick="iniciarJogo('estudar')">
                            📚
                            <strong>Estudar</strong>
                            <span>50 questões</span>
                        </button>

                        <button class="botao-modo"
                                onclick="iniciarJogo('treinar')">
                            🎯
                            <strong>Treinar</strong>
                            <span>70 questões</span>
                        </button>

                        <button class="botao-modo"
                                onclick="iniciarJogo('simulado')">
                            📝
                            <strong>Simulado</strong>
                            <span>100 questões</span>
                        </button>
                    </div>
                </div>
            </div>

            <footer>
                Desenvolvedor: Rayke Jovino de Souza
            </footer>
        </div>
    </section>


    <!-- TELA DO JOGO -->
    <section id="jogo" class="tela">
        <div class="jogo-container">

            <div class="topo-jogo">
                <button class="botao-sair" onclick="sairJogo()">
                    ← Sair
                </button>

                <div class="contador" id="contador">
                    1/50
                </div>

                <div class="pontuacao" id="pontuacao">
                    Pontos: 0
                </div>
            </div>

            <div class="barra-progresso">
                <div id="progresso" class="progresso"></div>
            </div>

            <div class="questao">
                <h2 id="pergunta" class="pergunta">
                    Carregando pergunta...
                </h2>

                <div class="imagem-area">
                    <div class="imagem-container">
                        <img id="imagemAnatomica"
                             src=""
                             alt="Imagem anatômica do material">

                        <div id="semImagem" class="sem-imagem">
                            Imagem não disponível.
                        </div>
                    </div>
                </div>

                <div id="alternativas" class="alternativas"></div>

                <div id="feedback" class="feedback"></div>

                <button id="proxima"
                        class="botao-proxima"
                        onclick="proximaQuestao()">
                    Próxima questão →
                </button>
            </div>

        </div>
    </section>


    <!-- TELA DE RESULTADO -->
    <section id="resultado" class="tela">
        <div class="container">

            <div class="resultado-container">
                <div class="resultado-box">

                    <div class="trofeu">🏆</div>

                    <h1>Resultado</h1>

                    <div id="porcentagem" class="porcentagem">
                        0%
                    </div>

                    <p id="mensagemResultado"
                       class="mensagem-resultado">
                        Muito bem!
                    </p>

                    <div class="botoes-resultado">

                        <button class="botao-principal"
                                onclick="jogarNovamente()">
                            🔄 Jogar novamente
                        </button>

                        <button class="botao-secundario"
                                onclick="voltarMenu()">
                            🏠 Voltar ao menu
                        </button>

                    </div>

                </div>
            </div>

            <footer>
                Desenvolvedor: Rayke Jovino de Souza
            </footer>

        </div>
    </section>


    <script src="game.js"></script>

</body>
</html>

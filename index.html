<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Baixar Vídeo do TikTok</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5e6b3;
    }

    .box {
      background: linear-gradient(145deg, #111, #1b1b1b);
      padding: 32px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 0 25px rgba(212,175,55,0.25);
      border: 1px solid rgba(212,175,55,0.35);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
      color: #d4af37;
      letter-spacing: 0.5px;
    }

    p {
      color: #e6d28c;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border-radius: 12px;
      border: 1px solid rgba(212,175,55,0.5);
      background: #000;
      color: #f5e6b3;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #bfae6a;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #d4af37, #b8962e);
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(212,175,55,0.6);
    }

    button:hover {
      box-shadow: 0 0 25px rgba(212,175,55,0.9);
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: #cbbd7a;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Baixar vídeo do TikTok</h1>
    <p>Cole o link do vídeo abaixo</p>

    <input id="link" type="text" placeholder="https://www.tiktok.com/...">

    <button onclick="baixar()">Baixar vídeo</button>

    <div class="footer">
      Premium • Sem marca d’água • Grátis
    </div>
  </div>

  <script>
    function baixar() {
      const url = document.getElementById("link").value;

      if (!url || !url.includes("tiktok.com")) {
        alert("Cole um link válido do TikTok");
        return;
      }

      const destino = "https://ssstik.io/pt";
      window.open(destino, "_blank");
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Video Downloader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #020617;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    p {
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>TikTok Video Downloader</h2>
    <input id="videoUrl" placeholder="Cole o link do TikTok aqui">
    <button onclick="downloadVideo()">Download</button>
    <p id="status"></p>
  </div>

  <script>

      const status = document.getElementById("status");

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>TikTok Gold Downloader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="Baixar vídeo do TikTok sem marca d’água. Downloader gratuito, rápido e fácil.">
  <meta name="keywords" content="baixar vídeo tiktok, tiktok sem marca d'água, downloader tiktok">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #2a1f0a, #000);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5e6b3;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        120deg,
        rgba(212,175,55,0.05),
        rgba(212,175,55,0.05) 2px,
        transparent 2px,
        transparent 40px
      );
      animation: moveGold 20s linear infinite;
    }

    @keyframes moveGold {
      to { transform: translate(-200px, -200px); }
    }

    .card {
      position: relative;
      background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
      border-radius: 26px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(212,175,55,0.4);
      box-shadow: 0 0 40px rgba(212,175,55,0.4);
      z-index: 1;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      color: #d4af37;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(212,175,55,0.7);
    }

    p {
      font-size: 14px;
      color: #e8dca0;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid rgba(212,175,55,0.6);
      background: #000;
      color: #f5e6b3;
      font-size: 14px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #d4af37, #ffeb99);
      color: #000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(212,175,55,0.6);
    }

    button:hover {
      transform: scale(1.03);
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>✨ TikTok Gold Downloader</h1>
    <p>Baixe vídeos do TikTok <b>sem marca d’água</b> de forma simples e rápida.</p>

    <input id="link" type="text" placeholder="Cole o link do TikTok aqui">

    <button onclick="baixar()">⬇️ Baixar sem marca d’água</button>

    <footer>
      Criado por <b>Rayke Jovino de Souza</b>
    </footer>
  </div>

  <script>
    function baixar() {
      const link = document.getElementById("link").value.trim();
      if (!link) {
        alert("Cole o link do TikTok primeiro!");
        return;
      }
      window.location.href = "https://snaptik.app/pt?url=" + encodeURIComponent(link);
    }
  </script>
</body>
</html>

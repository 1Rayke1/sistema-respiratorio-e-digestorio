<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Baixar vídeo do TikTok</title>
</head>
<body>

<h1>Baixar vídeo do TikTok</h1>
<p>Cole o link do vídeo abaixo</p>

<input id="link" type="text" placeholder="Cole o link do TikTok" style="width:320px;">
<br><br>
<button onclick="baixar()">Baixar vídeo</button>

<script>
function baixar() {
  const url = document.getElementById("link").value;

  if (!url || !url.includes("tiktok.com")) {
    alert("Cole um link válido do TikTok");
    return;
  }

  // SITE DE DOWNLOAD (FUNCIONA)
  const destino = "https://ssstik.io/pt";

  window.open(destino, "_blank");
}
</script>

</body>
</html>
